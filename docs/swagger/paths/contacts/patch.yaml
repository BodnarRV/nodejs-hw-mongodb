tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: 'Update the contact information for a specific contact.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          phoneNumber:
            type: string
            example: '+380983383897'
          email:
            type: string
            format: email
            example: 'johndoe@example.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            type: string
            format: binary
            description: 'Upload a photo'
responses:
  '200':
    description: 'Successfully updated the contact'
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '400':
    description: 'Bad request'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid request body'
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
